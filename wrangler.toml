name = "chat-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "chat.thefixer.in/*"
zone_name = "thefixer.in"

[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "85b6f025966944b5bb77d7a408dfae81"

# F41: edge rate-limit binding. Cloudflare provisions the rate-limit
# namespace from this declaration at `wrangler deploy`; no dashboard step.
# 60 requests per 60s per Supabase user id (validatedClaims.sub) on
# model-API paths only. UI page loads, /api/* bypass paths, and the SSE
# resume / regenerate / TTS / STT routes all share this single counter
# because the Worker keys the limit by `sub` (user identity), not URL.
# This is generous for normal chat usage but cuts off automated abuse.
# `simple.period` must be 10 or 60 per the binding contract.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
SUPABASE_URL = "https://btzaudxujnodtikhemar.supabase.co"
LOGIN_REDIRECT = "https://thefixer.in/login"
UPGRADE_REDIRECT = "https://thefixer.in/app/billing/upgrade"
WORKER_MODE = "enforce"
API_BASE_URL = "https://api.thefixer.in"

# EDGE_SECRET is a Workers Secret (not a [vars] entry). Injected into
# the `X-Edge-Secret` header on every upstream forward so the LibreChat
# origin can verify the request came from the Worker. Provision with:
#   wrangler secret put EDGE_SECRET
# The same value must be set as EDGE_SECRET in /opt/librechat/.env on
# the VM. Rotate by re-running `wrangler secret put` and updating .env
# on the VM atomically (worker first, then VM with brief STRICT off
# window if needed).

[observability]
enabled = true
head_sampling_rate = 1.0
